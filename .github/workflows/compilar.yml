name: Compilar e testar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  programa:
    name: Programa (Python) - testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libsndfile1
          pip install -r programa/requirements.txt
      - name: Testes automáticos
        working-directory: programa
        run: python -m unittest discover -s testes -p "test_*.py" -v

  plugin:
    name: Plugin VST3 - ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            exe: .exe
            pluginval: pluginval_Windows.zip
          - os: macos-latest
            nome: Mac
            exe: ""
            pluginval: pluginval_macOS.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar (baixa o JUCE 8.0.12)
        run: cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar plugin, standalone e testes
        run: cmake --build build --config Release --parallel 4 --target EstudioRitmos_VST3 EstudioRitmos_Standalone TestesNucleo HostDeTeste

      - name: Localizar arquivos gerados
        id: arq
        run: |
          VST3=$(find build -type d -name "Estudio de Ritmos.vst3" -path "*VST3*" | head -1)
          TN=$(find build -type f -name "TestesNucleo${{ matrix.exe }}" | head -1)
          HT=$(find build -type f -name "HostDeTeste${{ matrix.exe }}" | head -1)
          echo "vst3=$VST3" >> $GITHUB_OUTPUT
          echo "tn=$TN" >> $GITHUB_OUTPUT
          echo "ht=$HT" >> $GITHUB_OUTPUT
          echo "VST3: $VST3"; echo "Testes: $TN $HT"

      - name: Teste 1 - motor C++ igual ao Python, nota por nota
        run: |
          pip install mido
          python plugin/Testes/comparar_com_python.py programa "${{ steps.arq.outputs.tn }}"

      - name: Teste 2 - o .vst3 carregado num host, simulando o Cubase (ritmo e estilo Yamaha)
        run: |
          for b in 64 333 512 2048; do
            "${{ steps.arq.outputs.ht }}" "${{ steps.arq.outputs.vst3 }}" cubase $b host_cubase_$b.jsonl
            python plugin/Testes/verificar_host.py programa host_cubase_$b.jsonl $b
          done
          for b in 333 512; do
            "${{ steps.arq.outputs.ht }}" "${{ steps.arq.outputs.vst3 }}" estilo $b host_estilo_$b.jsonl programa/testes/dados/PianoBallad.sty
            python plugin/Testes/verificar_host.py programa host_estilo_$b.jsonl $b programa/testes/dados/PianoBallad.sty
          done
          for c in interno relocar semplayhead; do
            "${{ steps.arq.outputs.ht }}" "${{ steps.arq.outputs.vst3 }}" $c 512 host_$c.jsonl
          done
          python plugin/Testes/verificar_cenarios.py .
          "${{ steps.arq.outputs.ht }}" "${{ steps.arq.outputs.vst3 }}" estado 512 x.jsonl

      - name: Teste 3 - pluginval (validador de plugins)
        continue-on-error: true
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}
          unzip -q -o pv.zip
          if [ "${{ matrix.nome }}" = "Mac" ]; then PV=pluginval.app/Contents/MacOS/pluginval; else PV=./pluginval.exe; fi
          "$PV" --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 600000 "${{ steps.arq.outputs.vst3 }}"

      - name: Empacotar
        run: |
          mkdir -p pacote
          cp -R "${{ steps.arq.outputs.vst3 }}" pacote/
          cp plugin/LEIA-ME-PLUGIN.txt pacote/
          cp "programa/exemplos/"*.ritmo pacote/
          if [ "${{ matrix.nome }}" = "Windows" ]; then
            cp "$(find build -type f -name 'Estudio de Ritmos.exe' | head -1)" pacote/ || true
          else
            cp -R "$(find build -type d -name 'Estudio de Ritmos.app' | head -1)" pacote/ || true
          fi

      - name: Publicar para download
        uses: actions/upload-artifact@v4
        with:
          name: EstudioRitmos-VST3-${{ matrix.nome }}
          path: pacote
